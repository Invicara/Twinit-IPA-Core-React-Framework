name: Build

on:
  push:
    branches: [master, STAGING, NEXT-RELEASE]
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on:
      - codebuild-ops1-general-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pull-only role: this build's sole ECR use is fetching the semgrep
      # image. See github-actions-iam in Invicara/terraform for the subjects.
      # This repo is public, so a pull request opened from a fork gets neither
      # an OIDC token nor secrets and will stop at this step.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::550983980260:role/github-actions-ecr-readonly
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Replaces the Jenkins runSAST stage. Scans a clean tree, before
      # node_modules exists. Self-skips on pull_request events; Advanced
      # Security covers those. filter: false because the default redacts
      # findings by rewriting files in place, and `lerna publish` then refuses
      # to run against the dirty tree (EUNCOMMIT).
      - name: Scan for secrets
        uses: Invicara/github-actions/actions/scan-and-filter-secrets@v1
        with:
          registry: ${{ steps.login-ecr.outputs.registry }}
          filter: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Written by hand rather than via setup-node's registry-url: without a
      # scope that option sets the DEFAULT registry, and GitHub Packages does
      # not proxy npmjs, so every public dependency would 404.
      #
      # GH_PACKAGES_TOKEN is a REPOSITORY secret here, not the organization one
      # the other converted repos use: that org secret's visibility is private,
      # and this repo is public, so it would never be exposed to this workflow.
      # The token is needed to read the @dtplatform dependencies, not only to
      # publish, so without it the install fails rather than the publish.
      - name: Configure GitHub Packages auth
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "::error::GH_PACKAGES_TOKEN is empty; cannot read @dtplatform packages or publish @invicara ones"
            exit 1
          fi
          {
            echo "@dtplatform:registry=https://npm.pkg.github.com/"
            echo "@invicara:registry=https://npm.pkg.github.com/"
            echo "//npm.pkg.github.com/:_authToken=$GH_PACKAGES_TOKEN"
          } > "$HOME/.npmrc"

      # This repo is on lerna 9 with npm workspaces, so there is no bootstrap
      # step: the root install links the packages.
      - name: Install
        run: npm install --no-package-lock

      - name: Build
        run: npm run build

      # `from-package` publishes only packages whose version is not yet on the
      # registry. Called directly instead of `npm run publish`, which would
      # re-run the build.
      - name: Publish
        if: github.event_name == 'push'
        run: npx lerna publish from-package --yes
